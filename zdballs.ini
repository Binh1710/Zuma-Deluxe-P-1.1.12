; Special balls (zdslots.dll)
; Freq = how rare a ball is: about one every 2 x Freq / 100 seconds on each path (0 = never)
[Balls]
Enabled=1
; Rainbow ball: matches any colour
RainbowFreq=1500
; Skull ball: a little frog runs out of the skull hole and eats SkullEat balls from the front
SkullFreq=2500
SkullEat=10
SkullPoints=10
; Frog ball: every ball of its colour disappears, FrogPoints points per ball
FrogFreq=2000
FrogPoints=10
; at most this many balls of one kind on a path at the same time
MaxPerCurve=1

; Timeless mode (Gauntlet): seconds on the clock. At 0.0 all balls rush into the hole and you lose a life.
[Timeless]
Seconds=120
